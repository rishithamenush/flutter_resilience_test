name: Package and example checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.9.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      # No Flutter SDK is installed in this job, including for the CLI example.
      - run: dart pub get --no-example
      # Use one fixed formatter. Stable remains a compatibility test target,
      # but its formatter can change independently of the project's source.
      - name: Check Dart formatting
        if: matrix.sdk == '3.9.0'
        run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test

  flutter-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Check Flutter example formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver flutter_resilience_test_example.dart
        working-directory: example
      - run: flutter analyze --fatal-infos
        working-directory: example
      - run: flutter test
        working-directory: example
      - name: Run command-line example
        run: dart run flutter_resilience_test_example.dart
        working-directory: example
      - run: flutter build web
        working-directory: example
